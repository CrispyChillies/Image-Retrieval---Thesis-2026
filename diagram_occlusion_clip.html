<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #ffffff; display: flex; justify-content: center; padding: 40px 20px; }
  svg { font-family: 'Times New Roman', Times, serif; }
</style>
</head>
<body>
<svg width="720" height="820" viewBox="0 0 720 820" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-loop" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6e1a1a"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════ -->
  <!-- TITLE -->
  <!-- ══════════════════════════════════ -->
  <text x="360" y="36" text-anchor="middle" font-family="'Times New Roman', Times, serif"
        font-size="17" font-weight="bold" fill="#1a1a1a">
    Occlusion-Based Saliency Map (SBSM) — CLIP / ViT Backbone
  </text>
  <line x1="60" y1="46" x2="660" y2="46" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- ══════════════════════════════════ -->
  <!-- NODE 1 — Input -->
  <!-- ══════════════════════════════════ -->
  <rect x="140" y="64" width="440" height="50" rx="6" ry="6"
        fill="#f0f4ff" stroke="#1a3a6e" stroke-width="1.6"/>
  <text x="360" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a3a6e">Input Images</text>

  <!-- Arrow -->
  <line x1="360" y1="114" x2="360" y2="142" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- NODE 2 — Original Score -->
  <rect x="110" y="146" width="500" height="50" rx="6" ry="6"
        fill="#fff8e6" stroke="#8a5a00" stroke-width="1.6"/>
  <text x="360" y="178" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a5a00">Compute Original Similarity Score  s₀</text>

  <!-- Arrow -->
  <line x1="360" y1="196" x2="360" y2="224" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- NODE 3 — Generate Masks -->
  <rect x="110" y="228" width="500" height="50" rx="6" ry="6"
        fill="#f5f0ff" stroke="#4a1a8e" stroke-width="1.6"/>
  <text x="360" y="260" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a1a8e">Generate Sliding Window Masks</text>

  <!-- Arrow -->
  <line x1="360" y1="278" x2="360" y2="306" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LOOP BOX -->
  <rect x="30" y="300" width="660" height="330" rx="8" ry="8"
        fill="none" stroke="#6e1a1a" stroke-width="1.4" stroke-dasharray="7,4"/>
  <text x="50" y="318" font-size="10.5" font-style="italic" fill="#6e1a1a">Loop  i = 1 … N  (for each mask)</text>

  <!-- NODE 4 — Apply Mask -->
  <rect x="130" y="324" width="460" height="50" rx="6" ry="6"
        fill="#fafafa" stroke="#444" stroke-width="1.5"/>
  <text x="360" y="356" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Apply Mask to Retrieved Image</text>

  <!-- Arrow -->
  <line x1="360" y1="374" x2="360" y2="402" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- NODE 5 — CLIP Forward -->
  <rect x="110" y="406" width="500" height="50" rx="6" ry="6"
        fill="#f0f4ff" stroke="#1a3a6e" stroke-width="1.5"/>
  <text x="360" y="438" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a3a6e">CLIP / ViT Encoder  (Masked)</text>

  <!-- Arrow -->
  <line x1="360" y1="456" x2="360" y2="484" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- NODE 6 — Masked score -->
  <rect x="130" y="488" width="460" height="50" rx="6" ry="6"
        fill="#fff3f0" stroke="#8a2a00" stroke-width="1.5"/>
  <text x="360" y="520" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a2a00">Masked Similarity Score  s_i</text>

  <!-- Arrow -->
  <line x1="360" y1="538" x2="360" y2="566" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- NODE 7 — Accumulate -->
  <rect x="110" y="570" width="500" height="50" rx="6" ry="6"
        fill="#f0fff4" stroke="#1a6e3a" stroke-width="1.5"/>
  <text x="360" y="602" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a6e3a">Accumulate Saliency  K</text>

  <!-- DECISION diamond -->
  <line x1="360" y1="620" x2="360" y2="644" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <polygon points="360,650 430,674 360,698 290,674"
           fill="#fffbe6" stroke="#8a7000" stroke-width="1.6"/>
  <text x="360" y="669" text-anchor="middle" font-size="13" fill="#8a7000">i &lt; N ?</text>
  <text x="360" y="686" text-anchor="middle" font-size="11" fill="#8a7000">(more masks)</text>

  <!-- YES loop back -->
  <line x1="430" y1="674" x2="672" y2="674" stroke="#6e1a1a" stroke-width="1.4"/>
  <line x1="672" y1="674" x2="672" y2="340" stroke="#6e1a1a" stroke-width="1.4"/>
  <line x1="672" y1="340" x2="593" y2="340" stroke="#6e1a1a" stroke-width="1.4" marker-end="url(#arr-loop)"/>
  <text x="686" y="514" text-anchor="start" font-size="11" font-style="italic" fill="#6e1a1a" transform="rotate(90,686,514)">Yes  (next mask)</text>

  <!-- NO arrow down -->
  <line x1="360" y1="698" x2="360" y2="726" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="373" y="716" font-size="11" font-style="italic" fill="#444">No  (all N masks done)</text>

  <!-- NODE 8 — Weighted average -->
  <rect x="110" y="730" width="500" height="50" rx="6" ry="6"
        fill="#f0faff" stroke="#005a8e" stroke-width="1.6"/>
  <text x="360" y="762" text-anchor="middle" font-size="17" font-weight="bold" fill="#005a8e">Weighted Average Normalization</text>

  <!-- Arrow -->
  <line x1="360" y1="780" x2="360" y2="808" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- NODE 9 — Output -->
  <rect x="130" y="812" width="460" height="50" rx="6" ry="6"
        fill="#fffbe6" stroke="#8a7000" stroke-width="2"/>
  <text x="360" y="844" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a7000">Saliency Map</text>



</svg>
</body>
</html>
